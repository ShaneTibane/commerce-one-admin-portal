<app-header
  [brand]="brand"
  [search]="{ placeholder: 'Search anything...', shortcutHint: '⌘ K' }"
  [tenants]="tenants"
  [selectedTenant]="selectedTenant()"
  tenantLabel="Tenant"
  [user]="user"
  [notifications]="notifications()"
  (menuToggle)="toggleSidebar()"
  (tenantChange)="onTenantChange($event)"
  (searchSubmit)="onSearch($event)"
  (notificationClick)="openNotifications()"
  (helpClick)="openHelp()"
  (userMenuClick)="toggleUserMenu()"
/>

<main class="app-main">
  <router-outlet />
</main>

<ui-toast-container />
